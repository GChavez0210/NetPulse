name: Release

# Triggers on any tag push matching v* (e.g. v0.5.0, v1.0.0-beta.1).
# The manual trigger only regenerates SHA256SUMS.txt for a release that already
# exists — it does not rebuild or republish anything.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to regenerate SHA256SUMS.txt for (e.g. v0.6.0)'
        required: true
        type: string

# Opt into Node.js 24 for all GitHub Actions runners before the June 2026 forced cutover.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  publish-tauri:
    # Skipped on a manual run, which exists only to backfill checksums.
    if: github.event_name == 'push'

    permissions:
      contents: write   # Required to create and upload to GitHub Releases

    strategy:
      fail-fast: false  # Let all platforms finish even if one fails
      matrix:
        include:
          # ── Windows x64 ───────────────────────────────────────────────────
          - platform: windows-latest
            rust-target: ''
            args: ''

          # ── Linux x64 (produces .AppImage + .deb) ────────────────────────
          - platform: ubuntu-22.04
            rust-target: ''
            args: ''

          # ── macOS Apple Silicon (M1 / M2 / M3) ───────────────────────────
          - platform: macos-latest
            rust-target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    # Safety net: a single build should finish in well under 30 min. Without
    # this, a hung step (e.g. an interactive prompt) burns GitHub's 24h max
    # and stalls the whole release — which is exactly what happened on v0.5.0.
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node.js ────────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # ── Rust ───────────────────────────────────────────────────────────────
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust cross-compile target (macOS only)
        if: matrix.rust-target != ''
        run: rustup target add ${{ matrix.rust-target }}

      # ── Linux system libraries required by WebKit / Tauri ─────────────────
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            patchelf

      # ── Frontend ───────────────────────────────────────────────────────────
      - name: Install Node dependencies
        run: npm ci

      # ── Build + Publish ────────────────────────────────────────────────────
      - name: Build Tauri app and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'NetPulse ${{ github.ref_name }}'
          releaseBody: |
            See [CHANGELOG.md](https://github.com/GChavez0210/NetPulse/blob/main/CHANGELOG.md) for full release notes.

            ---

            ### Downloads

            | Platform | Installer |
            |---|---|
            | **Windows 10/11** (x64) | `NetPulse_*_x64-setup.exe` |
            | **Linux** (x64) | `NetPulse_*_amd64.AppImage` &nbsp;·&nbsp; `NetPulse_*_amd64.deb` |
            | **macOS** (Apple Silicon) | `NetPulse_*_aarch64.dmg` |

            > **macOS note:** Builds are unsigned. Right-click → Open on first launch to bypass Gatekeeper.
            > **Linux note:** Make the AppImage executable before running: `chmod +x NetPulse_*.AppImage`
            > **Windows note:** Defender may report `Trojan:Win32/Wacatac.B!ml` on the installer. It is a
            > false positive — see [Windows SmartScreen and Defender](https://github.com/GChavez0210/NetPulse#windows-smartscreen-and-defender)
            > for why an SSH client provokes it and how to verify what you downloaded.

            ---

            ### Verifying your download

            `SHA256SUMS.txt` lists the SHA-256 of every file in this release, and is uploaded once all
            three platforms have finished — it may appear a few minutes after the installers.

            - **Windows:** `Get-FileHash .\NetPulse_*_x64-setup.exe -Algorithm SHA256`
            - **Linux / macOS:** `sha256sum --ignore-missing -c SHA256SUMS.txt`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # ── Checksums ──────────────────────────────────────────────────────────────
  # A separate job so the manifest covers every platform's bundles, rather than
  # whichever build happened to finish first. Runs even if one platform failed,
  # matching fail-fast: false — a partial release still deserves checksums.
  checksums:
    needs: publish-tauri
    # Runs when the build matrix is skipped (manual backfill) as well as when it
    # finishes, and when one platform failed — a partial release still deserves
    # checksums. Only a cancelled run stops it.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write   # Required to upload the manifest to the release

    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Download the published release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --dir release-assets \
            --clobber
          # A re-run would otherwise checksum the previous manifest.
          rm -f release-assets/SHA256SUMS.txt

      - name: Generate SHA256SUMS.txt
        working-directory: release-assets
        run: |
          if [ -z "$(ls -A)" ]; then
            echo "::error::No assets found on $RELEASE_TAG; nothing to checksum."
            exit 1
          fi
          # Written outside the directory: redirecting into it would create the
          # file before the glob expands, and the manifest would list itself.
          sha256sum * > "$GITHUB_WORKSPACE/SHA256SUMS.txt"
          cat "$GITHUB_WORKSPACE/SHA256SUMS.txt"

      - name: Upload the checksum manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "$GITHUB_WORKSPACE/SHA256SUMS.txt" \
            --repo "${{ github.repository }}" \
            --clobber
