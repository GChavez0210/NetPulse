[package]
name = "netpulse"
version = "0.6.0"
edition = "2021"

[lib]
name = "netpulse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
hickory-resolver = { version = "0.26", features = ["tokio", "system-config"] }
futures = "0.3"
base64 = "0.22"
russh = { version = "=0.62.5", default-features = false, features = ["ring", "flate2", "rsa"] }
tokio-serial = "5.5"
zeroize = "1.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }
webpki-roots = "0.26"
x509-parser = "0.16"
